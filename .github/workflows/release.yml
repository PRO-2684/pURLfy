name: "tagged-release"

on:
  push:
    tags:
      - "v*"

jobs:
  tagged-release:
    name: "Tagged Release"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "write"

    steps:
      - uses: "actions/checkout@v4"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - uses: "actions/setup-node@v5"
        with:
          node-version: "24"
          cache: "pnpm"
      - run: "pnpm install --frozen-lockfile"
      - name: Verify tag matches package version
        shell: bash
        run: |
          test "$GITHUB_REF_NAME" = "v$(node -p "require('./package.json').version")"
      - run: "pnpm test"
      - run: "pnpm build"
      - name: Create GitHub Release
        env:
          GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
  npm-publish:
    name: "Publish to NPM"
    runs-on: "ubuntu-latest"
    permissions:
      contents: "read"
      id-token: "write"
    steps:
      - uses: "actions/checkout@v4"
      - name: Install pnpm
        uses: pnpm/action-setup@v4
      - uses: "actions/setup-node@v5"
        with:
          node-version: "24"
          cache: "pnpm"
      - run: "pnpm install"
      - run: "pnpm publish"
